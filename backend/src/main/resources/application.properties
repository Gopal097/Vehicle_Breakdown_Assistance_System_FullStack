
spring.application.name=Vehicle_Breakdown_Assistance_System

server.port=8080

# ---- Database (override with environment variables if needed) ----

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vehicle_breakdown}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- JWT (must be at least 32 characters) ----

app.jwt.secret=${JWT_SECRET:vehicle-breakdown-demo-secret-key-change-me-in-production-0123456789}

# ---- Default admin account created on first start ----

app.admin.email=${ADMIN_EMAIL:admin@vehiclebreakdown.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}